<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест клика по области</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; background: black; }
        #viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <script>
        const viewer = OpenSeadragon({
            id: "viewer",
            tileSources: { type: 'image', url: 'Karta_factions.png' },
            showNavigationControl: false,
            showZoomControl: false,
            gestureSettingsMouse: { clickToZoom: false, scrollToZoom: true }
        });

        // Координаты центра города (в пикселях)
        const cityX = 1030;
        const cityY = 465;
        const sizePx = 40; // сторона квадрата 40x40 пикселей

        let cityRect = null; // нормализованный прямоугольник

        viewer.addOnceHandler('open', () => {
            const item = viewer.world.getItemAt(0);
            const sz = item.getContentSize();
            const normX = cityX / sz.x;
            const normY = cityY / sz.y;
            const normW = sizePx / sz.x;
            const normH = sizePx / sz.y;
            cityRect = { x: normX - normW/2, y: normY - normH/2, w: normW, h: normH };

            // Красный квадрат для визуального ориентира
            const div = document.createElement('div');
            div.style.cssText = `width: ${sizePx}px; height: ${sizePx}px; background: rgba(255,0,0,0.5); border: 2px solid red; box-sizing: border-box; cursor: pointer;`;
            div.title = "Кликни сюда";
            viewer.addOverlay({
                element: div,
                location: new OpenSeadragon.Rect(cityRect.x, cityRect.y, cityRect.w, cityRect.h),
                placement: OpenSeadragon.Placement.ABSOLUTE
            });
        });

        viewer.addHandler('canvas-click', (event) => {
            if (!cityRect) return;
            const imgPt = viewer.viewport.viewportToImageCoordinates(event.position);
            const x = imgPt.x;
            const y = imgPt.y;
            const x0 = cityX - sizePx/2;
            const y0 = cityY - sizePx/2;
            if (x >= x0 && x <= x0 + sizePx && y >= y0 && y <= y0 + sizePx) {
                window.location.href = 'armoria.png'; // или 'city_elf.html'
            }
        });
    </script>
</body>
</html>
